<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Wealth LTD - Register</title>
    <link rel="stylesheet" href="BTC.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="signup-page">

    
    <header class="header-light">
        <nav>
            
            <h2 class="logo">Trust<span>Global</span></h2>
            <ul id="nav-links">
                <li><a href="BTC.html">HOME</a></li>
                <li><a href="BTC.html#bonus-banner">ABOUT</a></li>
                <li><a href="BTC.html#">PRICING</a></li>
                <li><a href="#">MARKET DATA</a></li>
                <li><a href="BTC.html#footer-grid">CONTACT</a></li>
            </ul>
            <button class="btn-green-nav">GET STARTED</button>
            <button id="menu-btn">&#9776;</button>
        </nav>
    </header>

    <section class="signup-container">
        <div class="signup-box">
            <h1>Register An Account</h1>
            
            <form action="#" method="POST" class="signup-form">
                <div class="input-group">
                    <input type="text" name="fullname" placeholder="Your Fullname" required>
                </div>
                
                <div class="input-group">
                    <input type="text" name="username" placeholder="Your Username" required>
                </div>
                
                <div class="input-group">
                    <input type="email" name="email" placeholder="Email" required>
                </div>
                
                <div class="input-group">
                    <input type="email" name="retype_email" placeholder="Retype Email" required>
                </div>
                
                <div class="input-group">
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                
                <div class="input-group">
                    <input type="password" name="confirm_password" placeholder="Confirm Password" required>
                </div>
                
                <div class="terms-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        I accept and agree with the <a href="#" class="legal-link">Terms & Conditions</a> and <a href="#" class="legal-link">Privacy Policy</a> .
                    </label>
                </div>
                
                <button type="submit" class="btn-signup">SIGNUP</button>
            </form>
        </div>
    </section>

    <script src="main.js"></script>
</body>
</html>
